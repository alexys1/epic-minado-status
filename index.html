<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minado CFX / ETC</title>
<style>
  :root { --bg:#f4f6f8; --card:#ffffff; --txt:#16202a; --mut:#5d6b78; --ok:#1a7f45; --bad:#c62828; --warn:#b26a00; --line:#e1e6ea; --cfx:#1f6feb; --etc:#1a7f45; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1419; --card:#18212a; --txt:#e8eef3; --mut:#93a3b1; --ok:#47c97a; --bad:#ff6b6b; --warn:#f0b04a; --line:#26323d; --cfx:#58a6ff; --etc:#47c97a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); margin:18px 0 8px; font-weight:600; }
  .banner { padding:14px 16px; border-radius:12px; font-weight:600; margin-bottom:12px; border:1px solid var(--line); background:var(--card); }
  .banner.ok { border-left:6px solid var(--ok); } .banner.bad { border-left:6px solid var(--bad); } .banner.warn { border-left:6px solid var(--warn); }
  .sub { color:var(--mut); font-size:13px; font-weight:400; margin-top:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--ac,var(--line)); border-radius:12px; padding:14px; }
  .top { display:flex; gap:8px; align-items:baseline; } .sym { font-weight:700; color:var(--ac); } .mut, .small { color:var(--mut); font-size:13px; }
  .big { font-size:32px; font-weight:700; letter-spacing:-.5px; margin-top:4px; } .big small { font-size:15px; color:var(--mut); font-weight:500; }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .dos b { display:block; font-size:16px; } .dos span { color:var(--mut); font-size:12px; }
  ul { margin:8px 0 0; padding-left:18px; font-size:13px; } li { margin:2px 0; }
  svg { width:100%; height:56px; margin-top:10px; display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; } th,td { text-align:left; padding:6px 5px; border-bottom:1px solid var(--line); } th { color:var(--mut); font-weight:600; }
  .tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 8px; }
  .ev { font:12px/1.5 ui-monospace,Consolas,monospace; color:var(--mut); list-style:none; padding:0; margin:0; }
  footer { color:var(--mut); font-size:12px; margin:16px 0 4px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Minado CFX / ETC &middot; RTX 5070 Ti</h1>
  <div id="banner" class="banner warn">Cargando&hellip;</div>
  <div class="grid" id="monedas"></div>
  <h3>Comparaci&oacute;n de rendimiento</h3>
  <div class="tablewrap"><table><thead><tr><th>Moneda</th><th>Tiempo</th><th>Hashrate prom.</th><th>Consumo</th><th>Energ&iacute;a</th><th>Temp. m&aacute;x.</th><th>Rend./h</th><th>Costo luz</th><th>Neto</th></tr></thead><tbody id="comp"></tbody></table></div>
  <div class="small" style="margin-top:6px" id="nota"></div>
  <h3>Eventos</h3>
  <ul class="ev" id="ev"></ul>
  <footer>Se refresca sola cada minuto. La PC sube los datos cada ~2 min; GitHub puede sumar hasta ~1 min. Sin direcciones ni claves.</footer>
</main>
<script>
// La API de GitHub entrega el dato fresco; raw.githubusercontent.com guarda cache de hasta 5 min (solo respaldo).
const URL_API = 'https://api.github.com/repos/alexys1/epic-minado-status/contents/status.json?ref=datos';
const URL_RAW = 'https://raw.githubusercontent.com/alexys1/epic-minado-status/datos/status.json';
async function leer(){
  try{
    const r = await fetch(URL_API, {headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok) throw new Error('API '+r.status);
    const o = await r.json();
    const bin = atob(o.content.replace(/\s/g,''));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }catch(e){
    const r = await fetch(URL_RAW + '?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }
}
const VIEJO_MIN = 8;
const $ = id => document.getElementById(id);
const COLOR = {CFX:'var(--cfx)', ETC:'var(--etc)', PRL:'#a371f7'};
function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e; }
function n(v, d){ return (v===null||v===undefined||v==='') ? '-' : Number(v).toLocaleString('es', {minimumFractionDigits:d, maximumFractionDigits:d}); }
function hs(v){ v=Number(v)||0; if(v>=1e9) return n(v/1e9,2)+' GH/s'; if(v>=1e6) return n(v/1e6,1)+' MH/s'; if(v>=1e3) return n(v/1e3,1)+' kH/s'; return n(v,0)+' H/s'; }
function fecha(t){ const d=new Date(Number(t)*1000); return d.toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function hace(seg){ if(seg<90) return 'hace '+Math.round(seg)+' s'; if(seg<5400) return 'hace '+Math.round(seg/60)+' min'; return 'hace '+(seg/3600).toFixed(1)+' h'; }
function setBanner(cls, titulo, sub){ const b=$('banner'); b.className='banner '+cls; b.textContent=titulo; if(sub){ b.appendChild(el('div','sub',sub)); } }
function spark(vals, color){
  const ns='http://www.w3.org/2000/svg'; const s=document.createElementNS(ns,'svg'); s.setAttribute('viewBox','0 0 300 56'); s.setAttribute('preserveAspectRatio','none');
  vals = (vals||[]).map(Number); if(vals.length<2) return null;
  const mx=Math.max(...vals), mn=Math.min(...vals), r=(mx-mn)||1;
  const pts = vals.map((v,i)=> (300*i/(vals.length-1)).toFixed(1)+','+(52-48*((v-mn)/r)).toFixed(1)).join(' ');
  const p=document.createElementNS(ns,'polyline'); p.setAttribute('points',pts); p.setAttribute('fill','none'); p.setAttribute('stroke',color); p.setAttribute('stroke-width','1.6'); p.setAttribute('vector-effect','non-scaling-stroke');
  s.appendChild(p); return s;
}
function dos(box, a, b){ const g=el('div','dos'); [a,b].forEach(([v,l])=>{ const d=el('div'); d.appendChild(el('b','',v)); d.appendChild(el('span','',l)); g.appendChild(d); }); box.appendChild(g); }
function tarjeta(m){
  const c=el('section','card'); c.style.setProperty('--ac', COLOR[m.sym]||'var(--mut)');
  const t=el('div','top'); t.appendChild(el('span','sym',m.sym)); t.appendChild(el('span','mut',m.nombre)); c.appendChild(t);
  if(!m.leido || m.total===null){ c.appendChild(el('div','small','Sin saldo todavia (aun no se mina esta moneda o el pool no respondio).')); return c; }
  const big=el('div','big',n(m.total,4)+' '); big.appendChild(el('small','',m.sym)); c.appendChild(big);
  c.appendChild(el('div','small','generado en total'+(m.precio?' ≈ $'+n(m.total*m.precio,2):'')));
  dos(c, [n(m.pend,4),'pendiente en el pool'], [n(m.paid,4),'ya enviado a Binance']);
  dos(c, [hs(m.hr_pool),'hashrate (1 h, visto por el pool)'], [n(m.ok,0)+' / '+n(m.bad,0),'shares buenas / malas']);
  c.appendChild(el('div','small','Rendimiento: '+(m.por_hora===null?'-':n(m.por_hora,4)+' '+m.sym+'/h')+' · ultima share: '+(m.ultima?fecha(m.ultima):'-')));
  const ul=el('ul'); if(m.pagos&&m.pagos.length){ m.pagos.slice().reverse().forEach(p=>ul.appendChild(el('li','',fecha(p.t)+' · +'+n(p.a,4)+' '+m.sym))); } else { ul.appendChild(el('li','mut','Aun sin pagos: se pagan '+m.pago)); }
  c.appendChild(ul);
  const sp=spark(m.serie, COLOR[m.sym]||'currentColor'); if(sp) c.appendChild(sp);
  return c;
}
async function cargar(){
  try{
    const d = await leer();
    const edad = Date.now()/1000 - d.ts;
    const g = d.gpu ? ' · GPU '+n(d.gpu.w,0)+' W, '+n(d.gpu.c,0)+' °C, '+n(d.gpu.uso,0)+'%' : '';
    if(edad > VIEJO_MIN*60){ setBanner('bad','Sin datos nuevos','Ultima actualizacion '+hace(edad)+'. La PC puede estar apagada o el publicador detenido.'); }
    else { setBanner('ok', d.fase || 'Minando', 'Actualizado '+hace(edad)+' ('+d.hora+')'+g); }
    const box=$('monedas'); box.textContent=''; (d.monedas||[]).forEach(m=>box.appendChild(tarjeta(m)));
    const tb=$('comp'); tb.textContent='';
    (d.monedas||[]).forEach(m=>{ const tr=document.createElement('tr');
      [m.sym, n(m.horas,2)+' h', n(m.hr_prom,1)+' '+(m.unidad||''), n(m.w_prom,0)+' W', n(m.kwh,2)+' kWh', n(m.tmax,0)+' °C', (m.por_hora===null?'-':n(m.por_hora,4)+'/h'),
         (m.costo_pen===undefined?'-':'S/ '+n(m.costo_pen,2)+(m.costo_usd!=null?' ($'+n(m.costo_usd,2)+')':'')),
         (m.neto_usd==null?'-':(m.neto_usd<0?'-':'')+'$'+n(Math.abs(m.neto_usd),2))]
        .forEach(v=>{ const td=document.createElement('td'); td.textContent=v; tr.appendChild(td); }); tb.appendChild(tr); });
    $('nota').textContent = d.costo_kwh_pen ? 'Luz: S/ '+n(d.costo_kwh_pen,4)+' por kWh'+(d.pen_por_usd?' (S/ '+n(d.pen_por_usd,3)+' = US$ 1)':'')+', solo el consumo de la GPU. Neto = valor minado - costo de luz.' : '';
    const ev=$('ev'); ev.textContent=''; (d.eventos||[]).forEach(x=>ev.appendChild(el('li','',x)));
  }catch(e){ setBanner('warn','No se pudieron cargar los datos', String(e)); }
}
cargar(); setInterval(cargar, 60000);
</script>
</body>
</html>
